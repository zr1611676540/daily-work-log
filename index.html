<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日工作记录</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      color: #333;
      font-size: 14px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header button {
      background: #ff8c42;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .date-title {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    .weekday {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    th, td {
      border: 1px solid #e8e8e8;
      padding: 8px 6px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background: #ff8c42;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
    }

    .type-cell {
      background: #ffecd9;
      color: #d35400;
      font-weight: 600;
      font-size: 15px;
    }

    .work-cell {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .duration-highlight {
      background: #e3f2fd;
      color: #1976d2;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 6px;
      display: inline-block;
    }

    .review-row td {
      padding: 0;
      background: #fff7ed;
    }

    .review-row textarea {
      width: 100%;
      min-height: 80px;
      border: none;
      padding: 12px;
      font-size: 14px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      background: transparent;
    }

    .review-label {
      background: #ff8c42;
      color: #fff;
      font-weight: 600;
      writing-mode: horizontal-tb;
    }

    .save-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .save-hint.show {
      opacity: 1;
    }

    .footer {
      text-align: center;
      padding: 16px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button id="prevDate">‹</button>
      <div>
        <div class="date-title" id="dateTitle">2026-08-12</div>
        <div class="weekday" id="weekday">星期三</div>
      </div>
      <button id="nextDate">›</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:18%">工作类型</th>
          <th style="width:22%">具体工作</th>
          <th style="width:16%">开始时间</th>
          <th style="width:16%">结束时间</th>
          <th style="width:14%">时长</th>
          <th style="width:14%">时长调整</th>
        </tr>
      </thead>
      <tbody id="workTableBody"></tbody>
      <tfoot>
        <tr class="review-row">
          <td class="review-label">今日复盘</td>
          <td colspan="5">
            <textarea id="reviewText" placeholder="记录今天的收获、不足和明天计划..."></textarea>
          </td>
        </tr>
      </tfoot>
    </table>

    <div class="footer">数据保存在当前手机浏览器中</div>
  </div>

  <div class="save-hint" id="saveHint">已自动保存</div>

  <script>
    const SCHEDULE = [
      { type: '上午', rows: [
        { work: 'Start', start: '5:30', end: '7:30', duration: '2h', adjust: '✅' },
        { work: 'Other', start: '7:30', end: '8:30', duration: '', adjust: '' },
        { work: 'Start', start: '8:30', end: '9:30', duration: '0.5h', adjust: '➕' },
        { work: '', start: '9:30', end: '12:00', duration: '', adjust: '' },
      ]},
      { type: '中午', rows: [
        { work: '', start: '12:00', end: '13:00', duration: '', adjust: '' },
        { work: 'Start', start: '13:00', end: '13:30', duration: '0.5h', adjust: '✅' },
        { work: '', start: '13:30', end: '14:00', duration: '', adjust: '' },
      ]},
      { type: '下午', rows: [
        { work: '', start: '14:00', end: '18:30', duration: '', adjust: '' },
        { work: 'Start', start: '18:30', end: '19:30', duration: '0.5h', adjust: '➕' },
        { work: '', start: '19:30', end: '20:00', duration: '', adjust: '' },
      ]},
      { type: '晚上', rows: [
        { work: '', start: '20:00', end: '21:00', duration: '', adjust: '' },
        { work: 'Start', start: '21:00', end: '23:00', duration: '2h', adjust: '➖' },
        { work: '', start: '23:00', end: '23:30', duration: '', adjust: '' },
      ]},
    ];

    let currentDate = new Date();

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getWeekday(date) {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[date.getDay()];
    }

    function loadReview(dateKey) {
      const raw = localStorage.getItem('workReview_' + dateKey);
      return raw || '';
    }

    function saveReview(dateKey, text) {
      localStorage.setItem('workReview_' + dateKey, text);
      showHint();
    }

    function showHint() {
      const hint = document.getElementById('saveHint');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 1200);
    }

    function render() {
      const dateKey = formatDate(currentDate);
      document.getElementById('dateTitle').textContent = dateKey;
      document.getElementById('weekday').textContent = getWeekday(currentDate);

      const tbody = document.getElementById('workTableBody');
      tbody.innerHTML = '';

      SCHEDULE.forEach(group => {
        group.rows.forEach((row, idx) => {
          const tr = document.createElement('tr');

          const typeCell = idx === 0
            ? `<td class="type-cell" rowspan="${group.rows.length}">${group.type}</td>`
            : '';

          const durClass = row.duration ? 'duration-highlight' : '';

          tr.innerHTML = `
            ${typeCell}
            <td class="work-cell">${row.work}</td>
            <td>${row.start}</td>
            <td>${row.end}</td>
            <td><span class="${durClass}">${row.duration}</span></td>
            <td>${row.adjust}</td>
          `;

          tbody.appendChild(tr);
        });
      });

      document.getElementById('reviewText').value = loadReview(dateKey);
    }

    document.getElementById('prevDate').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      render();
    });

    document.getElementById('nextDate').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      render();
    });

    document.getElementById('reviewText').addEventListener('input', () => {
      saveReview(formatDate(currentDate), document.getElementById('reviewText').value);
    });

    render();
  </script>
</body>
</html>
