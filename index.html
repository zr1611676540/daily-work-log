<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每日工作记录</title>
  <style>
    :root {
      --primary: #2c7be5;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a1a1a;
      --sub: #666;
      --border: #e1e4e8;
      --danger: #dc3545;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    .header {
      background: var(--card);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .date-bar button {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .date-bar .date-title {
      font-size: 18px;
      font-weight: 600;
    }

    .weekday {
      text-align: center;
      color: var(--sub);
      font-size: 14px;
      margin-top: -8px;
    }

    .summary-bar {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .summary-item {
      flex: 1;
      background: #eef4fd;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .summary-item .num {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .summary-item .label {
      font-size: 12px;
      color: var(--sub);
    }

    .section {
      margin: 12px;
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title .badge {
      font-size: 12px;
      background: var(--primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .time-slot {
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .time-slot:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .slot-name {
      font-weight: 600;
      color: var(--primary);
    }

    .slot-duration {
      font-size: 14px;
      color: var(--sub);
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .form-row label {
      font-size: 13px;
      color: var(--sub);
      min-width: 48px;
      flex-shrink: 0;
    }

    input[type="text"], input[type="time"], textarea {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="time"] {
      min-width: 90px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }

    .adjust-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .adjust-row input {
      width: 60px;
      flex: none;
      text-align: center;
    }

    .adjust-row span {
      font-size: 13px;
      color: var(--sub);
    }

    .review textarea {
      min-height: 120px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--sub);
      font-size: 12px;
    }

    .save-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .save-hint.show {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      color: var(--sub);
      padding: 20px;
      font-size: 14px;
    }

    .danger-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="date-bar">
      <button id="prevDate">‹</button>
      <div class="date-title" id="dateTitle">2026-08-12</div>
      <button id="nextDate">›</button>
    </div>
    <div class="weekday" id="weekday">星期三</div>
    <div class="summary-bar">
      <div class="summary-item">
        <div class="num" id="totalSlots">4</div>
        <div class="label">工作时段</div>
      </div>
      <div class="summary-item">
        <div class="num" id="totalHours">0.0</div>
        <div class="label">总时长(h)</div>
      </div>
      <div class="summary-item">
        <div class="num" id="filledSlots">0</div>
        <div class="label">已填写</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      工作时段记录
      <span class="badge">自动保存</span>
    </div>
    <div id="slotsContainer"></div>
  </div>

  <div class="section review">
    <div class="section-title">
      今日复盘
      <button class="danger-btn" id="clearToday" style="display:none;">清空今日</button>
    </div>
    <textarea id="reviewText" placeholder="记录今天的收获、不足和明天计划..."></textarea>
  </div>

  <div class="footer">
    数据仅保存在当前手机浏览器中
  </div>

  <div class="save-hint" id="saveHint">已自动保存</div>

  <script>
    const SLOTS = [
      { name: '上午', defaultStart: '09:00', defaultEnd: '12:00' },
      { name: '中午', defaultStart: '12:00', defaultEnd: '14:00' },
      { name: '下午', defaultStart: '14:00', defaultEnd: '18:00' },
      { name: '晚上', defaultStart: '18:00', defaultEnd: '21:00' },
    ];

    let currentDate = new Date();

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getWeekday(date) {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[date.getDay()];
    }

    function loadData(dateKey) {
      const raw = localStorage.getItem('workLog_' + dateKey);
      if (raw) return JSON.parse(raw);
      return {
        slots: SLOTS.map(s => ({
          name: s.name,
          content: '',
          start: s.defaultStart,
          end: s.defaultEnd,
          adjust: 0
        })),
        review: ''
      };
    }

    function saveData(dateKey, data) {
      localStorage.setItem('workLog_' + dateKey, JSON.stringify(data));
      showHint();
    }

    function showHint() {
      const hint = document.getElementById('saveHint');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 1200);
    }

    function calcDuration(start, end, adjust) {
      if (!start || !end) return 0;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let minutes = (eh * 60 + em) - (sh * 60 + sm);
      if (minutes < 0) minutes += 24 * 60;
      return parseFloat(((minutes + Number(adjust || 0)) / 60).toFixed(2));
    }

    function render() {
      const dateKey = formatDate(currentDate);
      const isToday = dateKey === formatDate(new Date());
      document.getElementById('dateTitle').textContent = dateKey;
      document.getElementById('weekday').textContent = getWeekday(currentDate);
      document.getElementById('clearToday').style.display = isToday ? 'inline-block' : 'none';

      const data = loadData(dateKey);
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';

      let total = 0;
      let filled = 0;

      data.slots.forEach((slot, idx) => {
        const dur = calcDuration(slot.start, slot.end, slot.adjust);
        total += dur;
        if (slot.content.trim()) filled++;

        const div = document.createElement('div');
        div.className = 'time-slot';
        div.innerHTML = `
          <div class="slot-header">
            <span class="slot-name">${slot.name}</span>
            <span class="slot-duration">时长 ${dur.toFixed(2)}h</span>
          </div>
          <div class="form-row">
            <label>工作</label>
            <input type="text" class="content" data-idx="${idx}" value="${escapeHtml(slot.content)}" placeholder="填写具体工作内容">
          </div>
          <div class="form-row">
            <label>开始</label>
            <input type="time" class="start" data-idx="${idx}" value="${slot.start}">
            <label>结束</label>
            <input type="time" class="end" data-idx="${idx}" value="${slot.end}">
          </div>
          <div class="form-row adjust-row">
            <label>调整</label>
            <input type="text" class="adjust" data-idx="${idx}" value="${slot.adjust || 0}">
            <span>分钟（正数加、负数减）</span>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('totalSlots').textContent = data.slots.length;
      document.getElementById('totalHours').textContent = total.toFixed(1);
      document.getElementById('filledSlots').textContent = filled;
      document.getElementById('reviewText').value = data.review;

      bindEvents(data, dateKey);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function bindEvents(data, dateKey) {
      const update = () => {
        data.slots.forEach((slot, idx) => {
          const root = document.querySelectorAll('.time-slot')[idx];
          slot.content = root.querySelector('.content').value;
          slot.start = root.querySelector('.start').value;
          slot.end = root.querySelector('.end').value;
          slot.adjust = root.querySelector('.adjust').value;
        });
        data.review = document.getElementById('reviewText').value;
        saveData(dateKey, data);
        render();
      };

      document.querySelectorAll('.time-slot input, #reviewText').forEach(el => {
        el.addEventListener('change', update);
        el.addEventListener('blur', update);
      });

      document.getElementById('reviewText').addEventListener('input', () => {
        data.review = document.getElementById('reviewText').value;
        saveData(dateKey, data);
      });
    }

    document.getElementById('prevDate').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() - 1);
      render();
    });

    document.getElementById('nextDate').addEventListener('click', () => {
      currentDate.setDate(currentDate.getDate() + 1);
      render();
    });

    document.getElementById('clearToday').addEventListener('click', () => {
      if (!confirm('确定清空今日所有记录吗？')) return;
      const dateKey = formatDate(currentDate);
      localStorage.removeItem('workLog_' + dateKey);
      render();
    });

    render();
  </script>
</body>
</html>
